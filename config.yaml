domain: global  # global or lam

graph:
  k: 16                    # only used for lam
  mesh_level: 2           # only used for global
  g2m_angle_deg: 7.5       # only used for global

model:
  hidden_dim: 64
  num_layers: 2
  node_dim: 7

data:
  train_end: 11688   
  val_end: 13149     
  lam:
    lat_min: 6
    lat_max: 38
    lon_min: 68
    lon_max: 98
    resolution: 1.0
  global:
    resolution: 1.0

training:
  rollout_steps: 4
  accum_steps: 16
  gcs_checkpoint: gs://era5-global-mesh-rayyan/checkpoints/checkpoint_latest.pt
  num_epochs: 30
  lr: 0.001